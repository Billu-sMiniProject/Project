<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>FitAI — Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #0d0d0d;
  --card:     #161616;
  --card2:    #1f1f1f;
  --border:   #2a2a2a;
  --border2:  #333;
  --accent:   #e8ff47;
  --accent-bg:rgba(232,255,71,0.08);
  --accent-glow:rgba(232,255,71,0.15);
  --red:      #ff6b35;
  --blue:     #4ade80;
  --text:     #f0f0f0;
  --sub:      #666;
  --head:     'Syne', sans-serif;
  --body:     'DM Sans', sans-serif;
  --radius:   16px;
  --radius-sm:10px;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--body);font-weight:300;color:var(--text);display:flex;flex-direction:column}

/* noise overlay */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.4;
}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 0;flex-shrink:0;position:relative;z-index:10;
}
.logo{
  font-family:var(--head);font-weight:800;font-size:1.4rem;
  letter-spacing:-0.03em;display:flex;align-items:center;gap:8px;
}
.logo-dot{
  width:8px;height:8px;background:var(--accent);border-radius:50%;
  animation:pulseDot 2s infinite;flex-shrink:0;
}
.logo b{color:var(--text)}

/* ── PROGRESS ── */
.progress-bar{
  height:3px;background:var(--border);
  position:relative;flex-shrink:0;margin-top:16px;
}
.progress-fill{
  height:100%;background:var(--accent);
  width:0%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 8px rgba(232,255,71,0.4);
}
.step-count{
  font-family:var(--body);font-size:0.7rem;color:var(--sub);
  padding:10px 24px 0;flex-shrink:0;font-weight:400;
}

/* ── SCREEN STACK ── */
.screens{
  flex:1;position:relative;overflow:hidden;
}

.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:0 24px 24px;
  will-change:transform,opacity;
  transition:transform 0.42s cubic-bezier(0.4,0,0.2,1),
             opacity   0.42s cubic-bezier(0.4,0,0.2,1);
}
.screen.active { transform:translateX(0);   opacity:1;   pointer-events:all }
.screen.prev   { transform:translateX(-60px);opacity:0;  pointer-events:none}
.screen.next   { transform:translateX(60px); opacity:0;  pointer-events:none}

/* ── QUESTION AREA ── */
.q-area{flex:0 0 auto;padding-top:32px;padding-bottom:24px}

.q-tag{
  font-family:var(--body);font-size:0.68rem;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--sub);
  margin-bottom:14px;display:block;font-weight:500;
}

.q-text{
  font-family:var(--head);font-size:2rem;line-height:1.2;
  color:var(--text);font-weight:800;letter-spacing:-0.03em;
}
.q-text em{color:var(--accent);font-style:normal}

.q-sub{
  font-size:0.83rem;color:var(--sub);margin-top:10px;
  line-height:1.55;font-weight:300;
}

/* ── BIG TEXT INPUT ── */
.big-input-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0}

.big-input{
  font-family:var(--head);font-size:2.8rem;font-weight:700;
  color:var(--text);background:transparent;border:none;outline:none;
  border-bottom:2px solid var(--border);padding:12px 0;
  width:100%;letter-spacing:-0.04em;transition:border-color 0.2s;
  caret-color:var(--accent);
}
.big-input::placeholder{color:#333}
.big-input:focus{border-color:rgba(232,255,71,0.5)}

.input-unit{
  font-family:var(--body);font-size:0.72rem;color:var(--sub);
  letter-spacing:0.04em;margin-top:10px;font-weight:400;
}

.big-submit{
  margin-top:28px;align-self:flex-start;
  background:var(--accent);color:#0d0d0d;border:none;
  font-family:var(--head);font-size:0.9rem;font-weight:700;
  letter-spacing:-0.01em;
  padding:13px 26px;border-radius:var(--radius-sm);cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s,opacity 0.2s;
}
.big-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,255,71,0.25)}
.big-submit:disabled{opacity:0.25;cursor:default;transform:none;box-shadow:none}

.input-err{
  font-family:var(--body);font-size:0.75rem;color:var(--red);
  margin-top:8px;min-height:16px;font-weight:400;
}

/* ── CHOICE GRID ── */
.choices{flex:1;display:grid;gap:10px;align-content:start;padding-top:4px;overflow-y:auto}
.choices.c1{grid-template-columns:1fr}
.choices.c2{grid-template-columns:1fr 1fr}
.choices.c3{grid-template-columns:1fr 1fr 1fr}
.choices.c4{grid-template-columns:1fr 1fr 1fr 1fr}

/* scroll hide */
.choices::-webkit-scrollbar{width:0}

.choice{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:16px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;text-align:center;
  transition:border-color 0.2s,background 0.2s,transform 0.15s,box-shadow 0.2s;
  position:relative;overflow:hidden;user-select:none;
}
.choice:hover{
  border-color:rgba(232,255,71,0.5);
  background:#1a1a0f;
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.choice:active{transform:scale(0.97)}
.choice.sel{
  border-color:var(--accent);
  background:#1a1a0f;
  box-shadow:0 0 0 1px rgba(232,255,71,0.15);
}
.choice.sel .ch-check{opacity:1;transform:scale(1)}

.ch-check{
  position:absolute;top:6px;right:8px;
  font-size:0.6rem;color:var(--accent);
  font-weight:700;
  opacity:0;transform:scale(0.5);
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}

.ch-emoji{font-size:1.8rem;line-height:1}
.ch-label{font-family:var(--head);font-size:0.82rem;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-0.01em}
.ch-sub{font-family:var(--body);font-size:0.65rem;color:var(--sub);line-height:1.3;font-weight:300}

/* ── MULTI-SELECT DONE ── */
.multi-done{
  flex-shrink:0;margin-top:12px;
  padding:12px;border-radius:var(--radius-sm);
  border:1.5px solid var(--blue);background:transparent;
  color:var(--blue);font-family:var(--head);font-size:0.88rem;
  font-weight:700;letter-spacing:-0.01em;
  cursor:pointer;width:100%;
  transition:background 0.2s;
}
.multi-done:hover{background:rgba(74,222,128,0.08)}
.multi-note{
  font-family:var(--body);font-size:0.72rem;color:var(--sub);
  font-weight:300;margin-bottom:8px;
}

/* ── LOADING SCREEN ── */
.loading-screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;
  background:var(--bg);z-index:20;
  opacity:0;pointer-events:none;transition:opacity 0.5s;
}
.loading-screen.show{opacity:1;pointer-events:all}

.loading-ring{
  width:64px;height:64px;border-radius:50%;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}
.loading-label{
  font-family:var(--body);font-size:0.8rem;color:var(--sub);
  font-weight:300;
}
.loading-name{
  font-family:var(--head);font-size:1.6rem;font-weight:800;color:var(--text);
  letter-spacing:-0.03em;
  opacity:0;animation:fadeUp 0.6s 0.3s forwards;
}

/* ── PLAN REVEAL ── */
.plan-screen{
  position:absolute;inset:0;overflow-y:auto;
  background:var(--bg);z-index:15;
  opacity:0;pointer-events:none;
  transform:translateY(30px);
  transition:opacity 0.6s,transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
.plan-screen.show{opacity:1;pointer-events:all;transform:translateY(0)}
.plan-screen::-webkit-scrollbar{width:0}

.plan-inner{padding:24px 20px 40px;max-width:520px;margin:0 auto}

.plan-hero{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:16px;
}
.plan-hero-top{
  padding:18px 20px 16px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,#1a1a0f,#161616);
}
.plan-goal-tag{
  font-family:var(--body);font-size:0.68rem;
  color:var(--sub);text-transform:uppercase;letter-spacing:0.06em;
  font-weight:500;margin-bottom:8px;
}
.plan-name{
  font-family:var(--head);font-size:1.3rem;font-weight:800;
  color:var(--text);letter-spacing:-0.03em;margin-bottom:2px;
}
.plan-tagline{font-size:0.75rem;color:var(--sub);font-weight:300}

.plan-kcal-block{
  padding:24px 20px;text-align:center;
  border-bottom:1px solid var(--border);
}
.plan-kcal-num{
  font-family:var(--head);font-size:4.5rem;line-height:1;font-weight:800;
  color:var(--accent);letter-spacing:-0.04em;
}
.plan-kcal-sub{
  font-family:var(--body);font-size:0.72rem;color:var(--sub);
  letter-spacing:0.06em;text-transform:uppercase;margin-top:6px;font-weight:300;
}

.plan-macros{display:grid;grid-template-columns:repeat(3,1fr)}
.plan-macro{
  padding:16px 12px;text-align:center;
  border-right:1px solid var(--border);
}
.plan-macro:last-child{border-right:none}
.macro-val{font-family:var(--head);font-size:1.4rem;font-weight:800;color:var(--text)}
.macro-key{font-family:var(--body);font-size:0.65rem;color:var(--sub);
  text-transform:uppercase;letter-spacing:0.04em;margin-top:3px;font-weight:300;}

.plan-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.split-cell{
  background:var(--card2);border-radius:10px;padding:14px;
  border:1px solid var(--border);
}
.split-cell.gym-cell{border-left:3px solid var(--accent);border-top:none}
.split-cell.rest-cell{border-left:3px solid var(--sub);border-top:none}
.split-kcal{font-family:var(--head);font-size:1.15rem;font-weight:800;color:var(--accent);margin:4px 0 2px}
.split-label{font-family:var(--body);font-size:0.65rem;color:var(--sub);font-weight:300}
.split-sub{font-family:var(--body);font-size:0.65rem;color:var(--sub);margin-top:2px;font-weight:300}

.plan-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.plan-tag{
  background:var(--card2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
  font-family:var(--body);font-size:0.75rem;color:var(--text);
  font-weight:300;
}

.plan-cta{padding:16px;display:flex;gap:8px}
.cta-primary{
  flex:1;padding:13px;border-radius:var(--radius-sm);border:none;
  background:var(--accent);color:#0d0d0d;
  font-family:var(--head);font-size:0.95rem;font-weight:700;
  letter-spacing:-0.01em;
  cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;
}
.cta-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,255,71,0.25)}
.cta-sec{
  padding:13px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--sub);font-family:var(--body);font-size:0.85rem;
  font-weight:300;cursor:pointer;transition:color 0.2s,border-color 0.2s;
}
.cta-sec:hover{color:var(--text);border-color:#444}

/* ── BACK BUTTON ── */
.back-btn{
  font-family:var(--body);font-size:0.8rem;color:var(--sub);
  font-weight:300;background:none;border:none;cursor:pointer;
  padding:0;display:flex;align-items:center;gap:6px;
  transition:color 0.2s;
}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:0.6}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── RESPONSIVE ── */
@media(max-width:420px){
  .q-text{font-size:1.55rem}
  .big-input{font-size:2.4rem}
  .plan-kcal-num{font-size:4.5rem}
  .choices.c4{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="logo"><span class="logo-dot"></span>FitAI</div>
  <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M10 3L5 8l5 5"/>
    </svg>
    back
  </button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="step-count" id="stepCount"></div>

<!-- Screen stack -->
<div class="screens" id="screens">
  <!-- screens injected by JS -->
</div>

<!-- Loading overlay -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-ring"></div>
  <div class="loading-name" id="loadingName"></div>
  <div class="loading-label">calculating your plan</div>
</div>

<!-- Plan reveal -->
<div class="plan-screen" id="planScreen">
  <div class="plan-inner" id="planInner"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const state = {
  data: {
    name:null,age:null,gender:null,height:null,weight:null,
    goal:null,eats_in_mess:null,activities:[],
    gym_days_per_week:null,gym_type:null,sport:null,
    sleep_hours:null,diet:null,targetWeight:null,duration:null,
  },
  stepIndex: 0,
  history: [],   // stack of stepIndex for back navigation
  multiSelected: [],
  plan: null,
};

// ═══════════════════════════════════════════════
// STEP DEFINITIONS
// ═══════════════════════════════════════════════
// Each step: { id, tag, question(state), sub?, type, ...typeOptions }
// types: text | choices | multi

function steps() {
  const d = state.data;
  const all = [
    {
      id:'name', tag:'Getting started',
      question: ()=>'What\'s your <em>name?</em>',
      type:'text', placeholder:'Your name…', unit:null,
      validate: v => v.length < 1 ? 'Please enter your name' : null,
      save: v => { d.name = v.charAt(0).toUpperCase()+v.slice(1) },
    },
    {
      id:'age', tag:'About you',
      question: ()=>`Nice to meet you, <em>${d.name}.</em><br>How old are you?`,
      type:'text', placeholder:'21', unit:'years old',
      validate: v => {const n=parseInt(v);return(!n||n<10||n>80)?'Enter a valid age (10–80)':null},
      save: v => { d.age = parseInt(v) },
    },
    {
      id:'gender', tag:'About you',
      question: ()=>'Your <em>gender?</em>',
      type:'choices', cols:2,
      choices:[
        {emoji:'♂️',label:'Male',  sub:'He / him',  value:'male'},
        {emoji:'♀️',label:'Female',sub:'She / her', value:'female'},
      ],
      save: v => { d.gender = v },
    },
    {
      id:'height', tag:'Body stats',
      question: ()=>'Your <em>height?</em>',
      type:'text', placeholder:'175', unit:'centimetres',
      validate: v=>{const n=parseFloat(v);return(!n||n<100||n>250)?'Enter height in cm (e.g. 175)':null},
      save: v=>{ d.height = parseFloat(v) },
    },
    {
      id:'weight', tag:'Body stats',
      question: ()=>'Current <em>weight?</em>',
      type:'text', placeholder:'70', unit:'kilograms',
      validate: v=>{const n=parseFloat(v);return(!n||n<30||n>300)?'Enter weight in kg':null},
      save: v=>{ d.weight = parseFloat(v) },
    },
    {
      id:'goal', tag:'Your goal',
      question: ()=>'What\'s your main <em>goal</em> right now?',
      type:'choices', cols:3,
      choices:[
        {emoji:'🔥',label:'Lose weight', sub:'Calorie deficit', value:'lose'},
        {emoji:'💪',label:'Gain muscle', sub:'Calorie surplus', value:'gain'},
        {emoji:'⚖️',label:'Maintain',   sub:'Stay balanced',   value:'maintain'},
      ],
      save: v=>{ d.goal=v; if(v==='maintain'){d.targetWeight=null;d.duration=12} },
    },
    // target weight — skipped for maintain
    {
      id:'target_weight', tag:'Your goal',
      skip: ()=>d.goal==='maintain',
      question: ()=>`What's your <em>target weight?</em>`,
      sub: ()=>`You're currently ${d.weight}kg`,
      type:'text', placeholder:'65', unit:'kilograms',
      validate: v=>{const n=parseFloat(v);return(!n||n<30||n>300)?'Enter target in kg':null},
      save: v=>{ d.targetWeight=parseFloat(v) },
    },
    {
      id:'duration', tag:'Your goal',
      skip: ()=>d.goal==='maintain',
      question: ()=>'How many <em>weeks</em> to reach it?',
      sub: ()=>{const diff=Math.abs((d.weight||70)-(d.targetWeight||65));return`Healthy pace: ~${Math.ceil(diff/0.5)} weeks`},
      type:'text', placeholder:'12', unit:'weeks',
      validate: v=>{const n=parseInt(v);return(!n||n<1||n>52)?'Enter 1–52 weeks':null},
      save: v=>{ d.duration=parseInt(v) },
    },
    {
      id:'diet', tag:'Food preferences',
      question: ()=>'Your <em>diet</em> preference?',
      type:'choices', cols:2,
      choices:[
        {emoji:'🥦',label:'Vegetarian', sub:'No meat or fish',  value:'vegetarian'},
        {emoji:'🍗',label:'Non-veg',    sub:'Meat & fish ok',   value:'non_veg'},
        {emoji:'🥚',label:'Eggetarian', sub:'Eggs, no meat',    value:'eggetarian'},
        {emoji:'🌱',label:'Vegan',      sub:'Plant-based only', value:'vegan'},
      ],
      save: v=>{ d.diet=v },
    },
    {
      id:'eats_in_mess', tag:'Food preferences',
      question: ()=>'Where do you usually <em>eat?</em>',
      type:'choices', cols:3,
      choices:[
        {emoji:'🏫',label:'College mess', sub:'Hostel canteen',  value:true},
        {emoji:'🏠',label:'Cook/buy self',sub:'Home or outside', value:false},
        {emoji:'🔀',label:'Mixed',        sub:'Both sometimes',  value:'mixed'},
      ],
      save: v=>{ d.eats_in_mess=v },
    },
    {
      id:'activities', tag:'Activity',
      question: ()=>'What do you do to <em>stay active?</em>',
      sub: ()=>'Select all that apply',
      type:'multi', cols:4,
      choices:[
        {emoji:'🏋️',label:'Gym',     sub:'Weights',    value:'gym'},
        {emoji:'🏊',label:'Swim',    sub:'Pool',        value:'swimming'},
        {emoji:'🏃',label:'Run',     sub:'Jog/sprint',  value:'running'},
        {emoji:'⚽',label:'Sport',   sub:'Cricket…',    value:'sport'},
        {emoji:'🚴',label:'Cycle',   sub:'Road/indoor', value:'cycling'},
        {emoji:'🧘',label:'Yoga',    sub:'Stretch',     value:'yoga'},
        {emoji:'🚶',label:'Walk',    sub:'Daily steps', value:'walking'},
        {emoji:'😴',label:'Not much',sub:'Sedentary',   value:'none'},
      ],
      save: v=>{ d.activities=v; if(v.includes('none')||v.length===0){d.activities=[];d.gym_days_per_week=0} },
    },
    {
      id:'gym_days', tag:'Gym details',
      skip: ()=>!d.activities.includes('gym'),
      question: ()=>'<em>How many days</em> a week do you train?',
      type:'choices', cols:4,
      choices:[
        {emoji:'1️⃣',label:'1 day',  sub:'Once',         value:1},
        {emoji:'2️⃣',label:'2 days', sub:'Twice',        value:2},
        {emoji:'3️⃣',label:'3 days', sub:'Classic',      value:3},
        {emoji:'4️⃣',label:'4 days', sub:'Upper/lower',  value:4},
        {emoji:'5️⃣',label:'5 days', sub:'PPL',          value:5},
        {emoji:'6️⃣',label:'6 days', sub:'High freq',    value:6},
        {emoji:'7️⃣',label:'Daily',  sub:'Every day',    value:7},
      ],
      save: v=>{ d.gym_days_per_week=v },
    },
    {
      id:'gym_type', tag:'Gym details',
      skip: ()=>!d.activities.includes('gym'),
      question: ()=>'What kind of <em>training?</em>',
      type:'choices', cols:3,
      choices:[
        {emoji:'🏋️',label:'Strength', sub:'Lifting & compounds', value:'strength'},
        {emoji:'🏃',label:'Cardio',   sub:'Treadmill, HIIT',     value:'cardio'},
        {emoji:'🔀',label:'Mixed',    sub:'Both',                value:'mixed'},
      ],
      save: v=>{ d.gym_type=v },
    },
    {
      id:'sport_name', tag:'Sport details',
      skip: ()=>!d.activities.includes('sport'),
      question: ()=>'Which <em>sport?</em>',
      sub: ()=>'e.g. cricket, football, basketball',
      type:'text', placeholder:'Cricket', unit:null,
      validate: v=>v.length<1?'Enter a sport name':null,
      save: v=>{ d.sport=v },
    },
    {
      id:'sleep', tag:'Recovery',
      question: ()=>'How much <em>sleep</em> do you get?',
      type:'choices', cols:2,
      choices:[
        {emoji:'😵',label:'< 6 hrs',  sub:'Sleep-deprived', value:5},
        {emoji:'😪',label:'6–7 hrs',  sub:'Slightly under', value:6.5},
        {emoji:'😊',label:'7–8 hrs',  sub:'Healthy range',  value:7.5},
        {emoji:'😴',label:'8+ hrs',   sub:'Well rested',    value:8.5},
      ],
      save: v=>{ d.sleep_hours=v },
    },
  ];
  return all;
}

// ═══════════════════════════════════════════════
// STEP ENGINE
// ═══════════════════════════════════════════════
let allSteps = [];
let currentStep = 0;

function visibleSteps() {
  return allSteps.filter(s => !s.skip || !s.skip());
}

function buildScreen(step, dir='next') {
  const vs = visibleSteps();
  const idx = vs.indexOf(step);
  const total = vs.length;

  // Progress
  document.getElementById('progressFill').style.width = `${(idx/total)*100}%`;
  document.getElementById('stepCount').textContent = `${idx+1} / ${total}`;

  // Back button
  document.getElementById('backBtn').style.display = idx > 0 ? 'flex' : 'none';

  const scr = document.getElementById('screens');

  // Remove old screens
  scr.querySelectorAll('.screen').forEach(el => {
    el.classList.add(dir === 'next' ? 'prev' : 'next');
    setTimeout(()=>el.remove(), 450);
  });

  const div = document.createElement('div');
  div.className = 'screen next';

  const qText = typeof step.question === 'function' ? step.question() : step.question;
  const subText = step.sub ? (typeof step.sub === 'function' ? step.sub() : step.sub) : '';

  let bodyHTML = '';

  if (step.type === 'text') {
    bodyHTML = `
      <div class="big-input-wrap">
        <input class="big-input" id="stepInput" type="${step.id==='age'||step.id==='height'||step.id==='weight'||step.id==='target_weight'||step.id==='duration'?'number':'text'}"
          inputmode="${step.id==='age'||step.id==='height'||step.id==='weight'||step.id==='target_weight'||step.id==='duration'?'numeric':'text'}"
          placeholder="${step.placeholder}" autocomplete="off" autocorrect="off" spellcheck="false">
        ${step.unit ? `<div class="input-unit">${step.unit}</div>` : ''}
        <div class="input-err" id="stepErr"></div>
        <button class="big-submit" id="stepSubmit" onclick="submitText()">Continue →</button>
      </div>
    `;
  } else if (step.type === 'choices') {
    const cards = step.choices.map(c=>`
      <div class="choice" data-val='${JSON.stringify(c.value)}' onclick="pickChoice(this,'${step.id}')">
        <div class="ch-check">✓</div>
        <div class="ch-emoji">${c.emoji}</div>
        <div class="ch-label">${c.label}</div>
        ${c.sub ? `<div class="ch-sub">${c.sub}</div>` : ''}
      </div>
    `).join('');
    bodyHTML = `<div class="choices c${step.cols||2}">${cards}</div>`;
  } else if (step.type === 'multi') {
    state.multiSelected = [];
    const cards = step.choices.map(c=>`
      <div class="choice" data-val='${JSON.stringify(c.value)}' onclick="toggleMulti(this)">
        <div class="ch-check">✓</div>
        <div class="ch-emoji">${c.emoji}</div>
        <div class="ch-label">${c.label}</div>
        ${c.sub ? `<div class="ch-sub">${c.sub}</div>` : ''}
      </div>
    `).join('');
    bodyHTML = `
      <div class="multi-note">Select all that apply</div>
      <div class="choices c${step.cols||2}">${cards}</div>
      <button class="multi-done" onclick="submitMulti('${step.id}')">Confirm selection →</button>
    `;
  }

  div.innerHTML = `
    <div class="q-area">
      <div class="q-tag">${step.tag}</div>
      <div class="q-text">${qText}</div>
      ${subText ? `<div class="q-sub">${subText}</div>` : ''}
    </div>
    ${bodyHTML}
  `;

  scr.appendChild(div);
  // Trigger transition
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.replace('next','active')));

  // Focus text input
  if (step.type === 'text') {
    setTimeout(()=>{
      const inp = document.getElementById('stepInput');
      if(inp) { inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitText()}); }
    }, 450);
  }
}

function pickChoice(el, stepId) {
  const vs = visibleSteps();
  const step = vs.find(s=>s.id===stepId);
  if (!step) return;
  const val = JSON.parse(el.dataset.val);
  // Flash select
  el.classList.add('sel');
  setTimeout(()=>{
    step.save(val);
    advanceStep();
  }, 200);
}

function toggleMulti(el) {
  const val = JSON.parse(el.dataset.val);
  const idx = state.multiSelected.findIndex(v=>JSON.stringify(v)===JSON.stringify(val));
  if (idx >= 0) {
    state.multiSelected.splice(idx,1);
    el.classList.remove('sel');
  } else {
    state.multiSelected.push(val);
    el.classList.add('sel');
  }
}

function submitMulti(stepId) {
  const vs = visibleSteps();
  const step = vs.find(s=>s.id===stepId);
  if (!step) return;
  const selected = state.multiSelected.length > 0 ? [...state.multiSelected] : ['none'];
  step.save(selected);
  advanceStep();
}

function submitText() {
  const vs = visibleSteps();
  const step = vs[currentStep];
  const inp = document.getElementById('stepInput');
  const err = document.getElementById('stepErr');
  if (!inp) return;
  const v = inp.value.trim();
  const errMsg = step.validate ? step.validate(v) : null;
  if (errMsg) {
    err.textContent = errMsg;
    inp.focus();
    return;
  }
  err.textContent = '';
  step.save(v);
  advanceStep();
}

function advanceStep() {
  state.history.push(currentStep);
  const vs = visibleSteps();
  currentStep++;
  // Skip non-applicable steps
  while (currentStep < vs.length && vs[currentStep].skip && vs[currentStep].skip()) currentStep++;
  if (currentStep >= vs.length) {
    showLoading();
    return;
  }
  buildScreen(vs[currentStep], 'next');
}

function goBack() {
  if (state.history.length === 0) return;
  currentStep = state.history.pop();
  const vs = visibleSteps();
  buildScreen(vs[currentStep], 'back');
}

// ═══════════════════════════════════════════════
// PLAN CALCULATION
// ═══════════════════════════════════════════════
function calculatePlan() {
  const d = state.data;
  const {weight,height,age,goal,activities,gym_days_per_week,gym_type,sleep_hours} = d;

  let bmr = d.gender==='female'
    ? 10*weight+6.25*height-5*age-161
    : 10*weight+6.25*height-5*age+5;
  bmr = Math.round(bmr);

  let mult = 1.2;
  if      (activities.includes('gym')&&gym_days_per_week>=5) mult=1.55;
  else if (activities.includes('gym')&&gym_days_per_week>=3) mult=1.45;
  else if (activities.includes('gym'))                        mult=1.375;
  else if (activities.includes('swimming')||activities.includes('running')) mult=1.45;
  else if (activities.includes('sport'))   mult=1.5;
  else if (activities.includes('cycling')) mult=1.4;
  else if (activities.includes('yoga')||activities.includes('walking')) mult=1.3;

  const sleepAdj = sleep_hours<6?-50:sleep_hours<7?-25:0;
  const tdee = Math.round(bmr*mult)+sleepAdj;

  let cal = tdee;
  if (goal==='lose') cal = tdee-500;
  else if (goal==='gain') cal = tdee+300;
  cal = Math.max(cal,1200);

  const hasGym = activities.includes('gym')&&gym_days_per_week>0;
  const gymCal  = hasGym ? Math.round(cal+(gym_type==='strength'?200:150)) : cal;
  const restCal = hasGym ? Math.round(cal-100) : cal;

  const proteinPerKg = goal==='gain'?1.8:goal==='lose'?1.6:activities.includes('gym')?1.6:1.4;
  const protein = Math.min(Math.round(weight*proteinPerKg),160);
  const fats    = Math.round((cal*0.25)/9);
  const carbs   = Math.round((cal-protein*4-fats*9)/4);
  const bmi     = (weight/((height/100)**2)).toFixed(1);

  return {
    ...d, bmr, tdee, calories:cal, protein, carbs, fats,
    gymDayCalories:gymCal, restDayCalories:restCal, bmi, proteinPerKg,
    createdAt: new Date().toISOString(),
  };
}

// ═══════════════════════════════════════════════
// LOADING + PLAN REVEAL
// ═══════════════════════════════════════════════
function showLoading() {
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('stepCount').textContent='';
  document.getElementById('backBtn').style.display='none';
  const ls = document.getElementById('loadingScreen');
  document.getElementById('loadingName').textContent = state.data.name || '';
  ls.classList.add('show');
  setTimeout(()=>{
    const plan = calculatePlan();
    state.plan = plan;
    localStorage.setItem('fitai_plan', JSON.stringify(plan));
    ls.classList.remove('show');
    setTimeout(()=>showPlan(plan), 400);
  }, 2200);
}

function showPlan(plan) {
  const goalLabel = {lose:'Weight Loss',gain:'Muscle Gain',maintain:'Maintenance'}[plan.goal]||'';
  const actLabels = {gym:'🏋️ Gym',swimming:'🏊 Swim',running:'🏃 Run',
    sport:`⚽ ${plan.sport||'Sport'}`,cycling:'🚴 Cycle',yoga:'🧘 Yoga',walking:'🚶 Walk'};

  const actTags = plan.activities
    .filter(a=>actLabels[a])
    .map(a=>`<div class="plan-tag">${actLabels[a]}</div>`)
    .join('');

  const hasGym = plan.activities.includes('gym')&&plan.gym_days_per_week>0;

  const splitHTML = hasGym ? `
    <div class="plan-split">
      <div class="split-cell gym-cell">
        <div class="split-label">🏋️ Gym day (${plan.gym_days_per_week}×/wk)</div>
        <div class="split-kcal">${plan.gymDayCalories.toLocaleString()} kcal</div>
        <div class="split-sub">${Math.round(plan.protein*1.05)}g protein</div>
      </div>
      <div class="split-cell rest-cell">
        <div class="split-label">😴 Rest day</div>
        <div class="split-kcal">${plan.restDayCalories.toLocaleString()} kcal</div>
        <div class="split-sub">${plan.protein}g protein</div>
      </div>
    </div>` : '';

  document.getElementById('planInner').innerHTML = `
    <div class="plan-hero">
      <div class="plan-hero-top">
        <div class="plan-goal-tag">${goalLabel}</div>
        <div class="plan-name">Your plan, ${plan.name}.</div>
        <div class="plan-tagline">BMI ${plan.bmi} · BMR ${plan.bmr} kcal · TDEE ${plan.tdee} kcal</div>
      </div>
      <div class="plan-kcal-block">
        <div class="plan-kcal-num">${plan.calories.toLocaleString()}</div>
        <div class="plan-kcal-sub">calories / day</div>
      </div>
      <div class="plan-macros">
        <div class="plan-macro"><div class="macro-val">${plan.protein}g</div><div class="macro-key">Protein</div></div>
        <div class="plan-macro"><div class="macro-val">${plan.carbs}g</div><div class="macro-key">Carbs</div></div>
        <div class="plan-macro"><div class="macro-val">${plan.fats}g</div><div class="macro-key">Fats</div></div>
      </div>
      ${splitHTML}
      ${actTags ? `<div class="plan-tags">${actTags}</div>` : ''}
      <div class="plan-cta">
        <button class="cta-primary" onclick="window.location.href='menu.html'">Set up mess menu →</button>
        <button class="cta-sec" onclick="window.location.href='log.html'">Skip</button>
      </div>
    </div>
  `;

  document.getElementById('planScreen').classList.add('show');
}

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
window.addEventListener('load', ()=>{
  // Check existing plan
  try {
    const existing = JSON.parse(localStorage.getItem('fitai_plan')||'null');
    if (existing&&existing.name&&existing.calories) {
      // Rebuild welcome-back screen manually
      allSteps = steps();
      const scr = document.getElementById('screens');
      document.getElementById('progressFill').style.width='100%';
      document.getElementById('stepCount').textContent='';
      const div = document.createElement('div');
      div.className = 'screen active';
      div.innerHTML = `
        <div class="q-area">
          <div class="q-tag">Welcome back</div>
          <div class="q-text">Hey <em>${existing.name}</em>,<br>your plan is ready.</div>
          <div class="q-sub">${existing.calories.toLocaleString()} kcal/day · ${existing.protein}g protein</div>
        </div>
        <div class="choices c1" style="padding-top:8px">
          <div class="choice" onclick="window.location.href='menu.html'">
            <div class="ch-emoji">📋</div><div class="ch-label">Set up mess menu</div><div class="ch-sub">Configure your canteen</div>
          </div>
          <div class="choice" onclick="window.location.href='log.html'">
            <div class="ch-emoji">📝</div><div class="ch-label">Go to food log</div><div class="ch-sub">Start tracking meals</div>
          </div>
          <div class="choice" onclick="localStorage.removeItem('fitai_plan');window.location.reload()">
            <div class="ch-emoji">🔄</div><div class="ch-label">Redo setup</div><div class="ch-sub">Recalculate your plan</div>
          </div>
        </div>
      `;
      scr.appendChild(div);
      return;
    }
  } catch(e){}

  // Fresh start
  allSteps = steps();
  currentStep = 0;
  buildScreen(visibleSteps()[0], 'next');
});
</script>
